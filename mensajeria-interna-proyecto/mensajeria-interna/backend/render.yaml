# Blueprint de despliegue para Render (https://render.com)
# En Render: New + > Blueprint > selecciona tu repo > confirma.
services:
  - type: web
    name: mensajeria-interna-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
